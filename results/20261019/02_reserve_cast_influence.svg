<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="510" viewBox="0 0 1100 510"><rect width="100%" height="100%" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#20333b}.axis{stroke:#83969c;stroke-width:1}.grid{stroke:#e1e9eb;stroke-width:1}</style><text x="30.00" y="32.00" font-size="22" text-anchor="start" font-weight="bold">Reserve error is concentrated in a few Red Sea casts</text><text x="30.00" y="56.00" font-size="12" text-anchor="start" font-weight="normal">Original mean + regional sigma (F01); contribution to the sum of equal-cast MSEs</text><rect x="60.000" y="110.000" width="549.807" height="70.000" fill="#005F73"/><rect x="609.807" y="110.000" width="139.498" height="70.000" fill="#CA6702"/><rect x="749.305" y="110.000" width="159.568" height="70.000" fill="#9B2226"/><rect x="908.873" y="110.000" width="131.127" height="70.000" fill="#94D2BD"/><rect x="65.000" y="221.000" width="16.000" height="16.000" fill="#005F73"/><text x="95.00" y="235.00" font-size="16" text-anchor="start" font-weight="normal">Central RS cast 117: 56.1%</text><rect x="65.000" y="267.000" width="16.000" height="16.000" fill="#CA6702"/><text x="95.00" y="281.00" font-size="16" text-anchor="start" font-weight="normal">North RS cast 182: 14.2%</text><rect x="65.000" y="313.000" width="16.000" height="16.000" fill="#9B2226"/><text x="95.00" y="327.00" font-size="16" text-anchor="start" font-weight="normal">Other three of top five: 16.3%</text><rect x="65.000" y="359.000" width="16.000" height="16.000" fill="#94D2BD"/><text x="95.00" y="373.00" font-size="16" text-anchor="start" font-weight="normal">Remaining 103 casts: 13.4%</text><text x="60.00" y="455.00" font-size="14" text-anchor="start" font-weight="normal">These are influence diagnostics, not a reason to remove valid observations.</text></svg>